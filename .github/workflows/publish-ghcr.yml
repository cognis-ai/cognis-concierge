# Publish the Cognis Concierge fork image (Dockerfile.cognis) to GHCR.
#
# Image: ghcr.io/cognis-ai/concierge (deployment-map §4.1 naming; founder
# AC-5 ratified GHCR). Style mirrors this repo's docker-image.yml, swapped to
# GITHUB_TOKEN auth. Coolify/compose consume the pushed DIGEST, never a tag
# (deployment-map §4.2); base images are digest-pinned inside Dockerfile.cognis.
name: Publish Cognis image (GHCR)

on:
  push:
    tags:
      - "v*"
      - "cognis-*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/cognis-ai/concierge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version number
        id: extract_version
        run: echo "CURRENT_VERSION=$(awk -F '\"' '/version =/ { print $2 }' pyproject.toml | head -n 1)" >> $GITHUB_ENV

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=
            type=raw,value=letta-${{ env.CURRENT_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cognis
          # Hetzner prod nodes are x86 (deployment-map §5); add arm64 if needed
          platforms: linux/amd64
          push: true
          build-args: |
            LETTA_VERSION=${{ env.CURRENT_VERSION }}
            LETTA_ENVIRONMENT=PRODUCTION
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
