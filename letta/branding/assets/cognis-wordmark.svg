<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cognis Concierge horizontal wordmark lockup (future template/email wiring per
  letta/branding/cognis_brand.py docstring; theming spec §5).

  Derived, not invented: typographic wordmark per
  cognis-platform/apps/landing/brand-manual.html §1 ("A typographic wordmark,
  no symbol"). The product word takes the blue accent — same treatment the
  marketing wordmark gives its accent span ("Cognis<span class='o-accent'>Ai</span>.",
  apps/marketing/components/o/nav.tsx:18-20). Trailing period is part of the mark.

  Token provenance (cognis-platform/packages/design-tokens/tokens.json):
    base text   -> currentColor, default color.brand.fg #1a1a1a (root color attr)
    accent word -> color.brand.primary #0099ff (canonical primary)
    font family -> fontFamily.product 'Inter', ui-sans-serif, system-ui, sans-serif
    weight 600 / letter-spacing -0.03em -> .o-wordmark, apps/marketing/app/ordina-site.css:94-97

  Interim asset pending the design-team master mark (spec §5 / open dependency 2).
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 512 128"
     width="512" height="128" color="#1a1a1a" role="img"
     aria-label="Cognis Concierge">
  <text x="10" y="64" fill="currentColor"
        font-family="'Inter', ui-sans-serif, system-ui, sans-serif"
        font-size="54" font-weight="600" letter-spacing="-0.03em"
        dominant-baseline="central">Cognis <tspan fill="#0099ff">Concierge</tspan>.</text>
</svg>
